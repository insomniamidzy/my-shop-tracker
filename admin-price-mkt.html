<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品價格與排程控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f5f5f7; margin: 0; }
        .header { background: #002D62; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 18px; }
        
        /* ✨ 新增：統一控制中心樣式 */
        .global-control { background: #e3f2fd; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 2px dashed #64b5f6; }
        .global-control h3 { margin: 0 0 10px 0; font-size: 16px; color: #1565c0; display: flex; align-items: center; gap: 5px; }
        .flex-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-global-apply { flex: 1; background: #17a2b8; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-global-save { flex: 1; background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 4px 6px rgba(40,167,69,0.2); }
        .btn-global-apply:active { opacity: 0.8; }
        .btn-global-save:active { opacity: 0.8; }

        .product-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .prod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .prod-title { font-weight: bold; font-size: 16px; color: #333; }
        .prod-sub { font-size: 12px; color: #888; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
        
        .input-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .input-group label { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .input-group input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #0071e3; box-shadow: 0 0 0 2px rgba(0,113,227,0.2); }
        
        .schedule-zone { background: #fff8e1; padding: 10px; border-radius: 8px; border: 1px dashed #f5c6cb; margin-bottom: 15px; }
        
        .btn-save { background: #e0e0e0; color: #333; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-save:hover { background: #d5d5d5; }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; width: 100%; }
        
        #loading { text-align: center; color: #666; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚙️ 商品定時調價控制台</h2>
        <a href="index.html" style="color: white; font-size: 13px; text-decoration: none;">➔ 回首頁</a>
    </div>

    <!-- ✨ 統一排程控制中心 -->
    <div class="global-control">
        <h3>🌟 統一排程控制中心</h3>
        <div class="input-group">
            <label>1. 選擇統一的「自動切換時間」</label>
            <input type="datetime-local" id="global-time">
        </div>
        <div class="flex-buttons">
            <button class="btn-global-apply" onclick="applyGlobalTime()">👇 2. 套用時間到下方商品</button>
        </div>
        <div class="flex-buttons">
            <button class="btn-global-save" id="btn-global-save" onclick="saveAllProducts()">💾 3. 一鍵儲存所有修改</button>
        </div>
        <div class="flex-buttons">
            <button onclick="clearAllSchedules()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 10px;">
                🧹 一鍵清除殘留排程
            </button>
        </div>
    </div>

    <div id="loading">讀取商品資料中，請稍候...</div>
    <div id="product-list"></div>

    <script>
        const SUPABASE_URL = 'https://sizlxeoconbuxkyrtnqd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpemx4ZW9jb25idXhreXJ0bnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTg4OTgsImV4cCI6MjA5NDMzNDg5OH0.Lu6f3HgJ_wsM-pLhK0j3tNbK7hu_1E19rj63iVn0qqI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProductIds = []; // 記住所有商品的 ID

        async function loadProducts() {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('sort_order', { ascending: true });

            if (error) {
                alert('讀取商品失敗：' + error.message);
                return;
            }

            const listDiv = document.getElementById('product-list');
            listDiv.innerHTML = '';
            document.getElementById('loading').style.display = 'none';
            allProductIds = []; // 清空陣列

            data.forEach(prod => {
                allProductIds.push(prod.id); // 收集 ID，讓一鍵套用可以使用

                let localTimeStr = '';
                if (prod.scheduled_time) {
                    const d = new Date(prod.scheduled_time);
                    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    localTimeStr = d.toISOString().slice(0, 16);
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="prod-header">
                        <span class="prod-title">💎 ${prod.item_name}</span>
                        <span class="prod-sub">${prod.game_id === 'identity-v' ? '第五人格' : prod.game_id}</span>
                    </div>
                    
                    <div class="input-group">
                        <label>💵 目前前台售價 (立即生效)</label>
                        <input type="number" id="price-${prod.id}" value="${prod.price}">
                    </div>

                    <div class="schedule-zone">
                        <div class="input-group">
                            <label>⏰ 排程特價 (未來售價)</label>
                            <input type="number" id="sched-price-${prod.id}" value="${prod.scheduled_price || ''}" placeholder="不設定請留空">
                        </div>
                        <div class="input-group">
                            <label>📅 自動切換生效時間</label>
                            <input type="datetime-local" id="sched-time-${prod.id}" value="${localTimeStr}">
                        </div>
                        <button class="btn-clear" onclick="clearSchedule('${prod.id}')">🗑️ 單獨清除此排程</button>
                    </div>

                    <!-- 單獨儲存按鈕改成灰色，引導使用上方的一鍵儲存 -->
                    <button class="btn-save" id="btn-${prod.id}" onclick="saveProduct('${prod.id}', true)">單獨儲存此商品</button>
                `;
                listDiv.appendChild(card);
            });
        }

        // ✨ 統一套用時間的邏輯
        function applyGlobalTime() {
            const globalTime = document.getElementById('global-time').value;
            if (!globalTime) {
                alert('⚠️ 請先在第一步選擇時間喔！');
                return;
            }
            
            // 把時間塞進每一個商品的格子裡
            allProductIds.forEach(id => {
                const timeInput = document.getElementById(`sched-time-${id}`);
                if (timeInput) {
                    timeInput.value = globalTime;
                }
            });
        }

        // ✨ 一鍵儲存所有商品的邏輯
        async function saveAllProducts() {
            const globalBtn = document.getElementById('btn-global-save');
            globalBtn.innerText = '⏳ 正在同步所有商品至資料庫...';
            globalBtn.style.background = '#666';
            globalBtn.disabled = true;

            // 利用 Promise.all 同時發送所有更新請求，速度超快
            const promises = allProductIds.map(id => saveProduct(id, false)); 
            await Promise.all(promises);

            globalBtn.innerText = '✅ 所有修改已成功儲存！';
            globalBtn.style.background = '#28a745';
            setTimeout(() => {
                globalBtn.innerText = '💾 3. 一鍵儲存所有修改';
                globalBtn.disabled = false;
            }, 3000);
        }

        // 原本的單筆儲存邏輯 (稍作修改以支援一鍵儲存)
        async function saveProduct(id, showAlert = true) {
            const btn = document.getElementById(`btn-${id}`);
            if(showAlert) btn.innerText = '儲存中...';

            const newPrice = document.getElementById(`price-${id}`).value;
            const schedPrice = document.getElementById(`sched-price-${id}`).value;
            const schedTime = document.getElementById(`sched-time-${id}`).value;

            const updateData = {
                price: newPrice ? parseInt(newPrice) : 0,
                scheduled_price: schedPrice ? parseInt(schedPrice) : null,
                scheduled_time: schedTime ? new Date(schedTime).toISOString() : null
            };

            const { error } = await supabaseClient.from('products').update(updateData).eq('id', id);

            if (error) {
                console.error('儲存失敗：', error.message);
                if(showAlert) alert('儲存失敗：' + error.message);
            } else if (showAlert) {
                btn.innerText = '✅ 儲存成功';
                btn.style.background = '#28a745';
                btn.style.color = 'white';
                setTimeout(() => {
                    btn.innerText = '單獨儲存此商品';
                    btn.style.background = '#e0e0e0';
                    btn.style.color = '#333';
                }, 2000);
            }
        }

        async function clearSchedule(id) {
            document.getElementById(`sched-price-${id}`).value = '';
            document.getElementById(`sched-time-${id}`).value = '';
            await saveProduct(id, true);
        }
        // ✨ 清除排程功能
        async function clearAllSchedules() {
            // 再次確認，防呆機制
            if (!confirm("確定要清除殘留的排程資料嗎？\n(這會將所有商品的排程時間與排程價格清空，不會影響目前已經生效的售價)")) {
                return;
            }
        
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "清除中...";
            btn.disabled = true;
        
            try {
                // 🚨 這裡的 'products' 請確認是否為你的商品資料表名稱
                // 🚨 這裡的 'scheduled_time' 和 'scheduled_price' 請替換成你資料庫實際使用的欄位名稱
                const { error } = await supabaseClient
                    .from('products')
                    .update({ 
                        scheduled_time: null, 
                        scheduled_price: null 
                    })
                    .not('scheduled_time', 'is', null); // 只針對有排程資料的商品進行清空，節省效能
        
                if (error) throw error;
        
                alert("✅ 排程資料已成功清空！");
                
                // 重新讀取畫面上的商品列表 (請替換成你原本用來載入列表的函式，例如 loadProducts 或 fetchProducts)
                if (typeof loadProducts === 'function') {
                    loadProducts();
                } else {
                    window.location.reload(); // 如果找不到重載函式，就直接重新整理網頁
                }
            } catch (err) {
                console.error("清除排程失敗:", err);
                alert("❌ 清除失敗，請檢查權限或網路連線：" + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
