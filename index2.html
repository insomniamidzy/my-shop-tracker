<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N卡序號 成本紀錄</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 320px; }
    h2 { color: #333; margin-top: 0; text-align: center; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.2s; }
    input:focus { border-color: #0071e3; box-shadow: 0 0 0 2px rgba(0,113,227,0.2); }
    button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #218838; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>💰 成本批量寫入</h2>
    
    <div class="input-group">
      <label>序號成本 (元)</label>
      <input type="number" id="price" placeholder="例如: 2080" required>
    </div>
    
    <div class="input-group">
      <label>購買張數</label>
      <input type="number" id="quantity" placeholder="例如: 15" required>
    </div>
    
    <button id="submitBtn" onclick="submitData()">🚀 寫入 Google Sheet</button>
    <div id="status"></div>
  </div>

  <script>
    // 🛑 請在這裡貼上你部署的 GAS 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzpo2NDhA91p09X_oRQeYJHzC6oZde--QIirxEXVmNC69uBfrr1WE8B0Y0iUhq3KHUt/exec';

    async function submitData() {
      const price = document.getElementById('price').value;
      const quantity = document.getElementById('quantity').value;
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      if (!price || !quantity || quantity <= 0) {
        status.innerText = '⚠️ 請輸入正確的價格與張數！';
        status.style.color = '#d9383a';
        return;
      }

      btn.disabled = true;
      btn.innerText = '⏳ 寫入試算表中...';
      status.innerText = '';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          // 用 text/plain 避免 CORS preflight 問題
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
          body: JSON.stringify({ 
            price: Number(price), 
            quantity: Number(quantity) 
          })
        });
        
        const result = await response.json();

        if (result.success) {
          status.innerText = '✅ ' + result.message;
          status.style.color = '#1e7e34';
          // 清空輸入框方便下次輸入
          document.getElementById('price').value = '';
          document.getElementById('quantity').value = '';
        } else {
          status.innerText = '❌ 寫入失敗: ' + result.error;
          status.style.color = '#d9383a';
        }
      } catch (err) {
        status.innerText = '❌ 網路連線錯誤，請檢查網路';
        status.style.color = '#d9383a';
      }

      btn.disabled = false;
      btn.innerText = '🚀 寫入 Google Sheet';
    }
  </script>
</body>
</html>
