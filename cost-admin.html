<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG 成本與貨源控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #002D62; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .item-row:hover { background: #f9f9fb; }
        
        .item-info { flex: 2; }
        .item-name { font-weight: bold; font-size: 16px; color: #333; }
        .item-game { font-size: 12px; color: #888; background: #e8ecef; padding: 2px 6px; border-radius: 4px; }
        
        .controls { flex: 3; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
        
        input[type="number"] { padding: 8px; width: 100px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; text-align: center; }
        select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        
        .btn-update { padding: 8px 16px; background: #107c41; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-update:hover { background: #0b592e; }
        .btn-update:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 SG 成本與貨源控制台</h1>
        <p style="color: #666; margin-bottom: 20px;">葉子專用：可以直接在下方修改成本或新增商品，點擊「更新」即可同步至網站。</p>
        
        <!-- ✨ 新增：讓葉子可以自己增加新商品的區塊 -->
        <div style="background: #e8f4fd; padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <strong style="color: #0071e3;">➕ 新增商品：</strong>
            <select id="new-game-id" style="padding: 6px;">
                <option value="valorant">特戰英豪</option>
                <option value="identity-v">第五人格</option>
            </select>
            <input type="text" id="new-item-name" placeholder="輸入完整商品名稱 (例: 13050 特務幣 x 1)" style="padding: 6px; width: 250px;">
            <input type="number" id="new-item-price" placeholder="成本價" style="padding: 6px; width: 80px;">
            <button class="btn-update" style="background: #0071e3;" onclick="addNewItem()">新增</button>
        </div>

        <div id="cost-list">
            <p>資料載入中...</p>
        </div>
    </div>

    <script>
        // 替換成你的 Supabase 資訊 (記得填入你的 ANON KEY)
        const SUPABASE_URL = 'https://sizlxeoconbuxkyrtnqd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpemx4ZW9jb25idXhreXJ0bnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTg4OTgsImV4cCI6MjA5NDMzNDg5OH0.Lu6f3HgJ_wsM-pLhK0j3tNbK7hu_1E19rj63iVn0qqI';
        
        // ✨ 改名為 adminClient 避免衝突
        const adminClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 載入商品列表
        async function loadCosts() {
            // ✨ 這裡使用 adminClient
            const { data, error } = await adminClient.from('sg_costs').select('*').order('game_id');
            if (error) return alert("讀取失敗：" + error.message);
            
            const listDiv = document.getElementById('cost-list');
            listDiv.innerHTML = '';

            // ✨ 防呆處理：如果資料庫是空的
            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; padding: 40px; color: #888; background: #f9f9fb; border-radius: 8px;">目前還沒有任何商品喔！請使用上方的「新增商品」功能來建立第一筆資料。</div>';
                return;
            }

            data.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div class="item-info">
                        <span class="item-game">${item.game_id === 'valorant' ? '特戰英豪' : (item.game_id === 'identity-v' ? '第五人格' : item.game_id)}</span><br>
                        <span class="item-name">${item.item_name}</span>
                    </div>
                    <div class="controls">
                        <label>成本(NT$)：</label>
                        <input type="number" id="price-${item.id}" value="${item.cost_price}">
                        
                        <select id="stock-${item.id}" style="background-color: ${item.in_stock ? '#e8f5e9' : '#ffebee'};">
                            <option value="true" ${item.in_stock ? 'selected' : ''}>🟢 供貨正常</option>
                            <option value="false" ${!item.in_stock ? 'selected' : ''}>🔴 缺貨中</option>
                        </select>

                        <button class="btn-update" onclick="updateItem(${item.id}, '${item.item_name}')">💾 更新</button>
                    </div>
                `;
                listDiv.appendChild(row);
            });
        }

        // 更新現有商品
        async function updateItem(id, itemName) {
            const newPrice = document.getElementById(`price-${id}`).value;
            const newStock = document.getElementById(`stock-${id}`).value === 'true';

            // ✨ 這裡使用 adminClient
            const { error } = await adminClient
                .from('sg_costs')
                .update({ cost_price: newPrice, in_stock: newStock })
                .eq('id', id);

            if (error) {
                alert(`❌ [${itemName}] 更新失敗: \n` + error.message);
            } else {
                alert(`✅ [${itemName}] 已更新！`);
                loadCosts(); 
            }
        }

        // 處理「新增商品」邏輯
        async function addNewItem() {
            const gameId = document.getElementById('new-game-id').value;
            const itemName = document.getElementById('new-item-name').value.trim();
            const itemPrice = document.getElementById('new-item-price').value;

            if (!itemName || !itemPrice) {
                return alert("請填寫完整的商品名稱與成本價！");
            }

            // ✨ 這裡使用 adminClient
            const { error } = await adminClient.from('sg_costs').insert([
                { game_id: gameId, item_name: itemName, cost_price: parseInt(itemPrice), in_stock: true }
            ]);

            if (error) {
                alert("❌ 新增失敗，請檢查商品名稱是否重複：" + error.message);
            } else {
                alert("✅ 成功新增商品！");
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-price').value = '';
                loadCosts(); // 重新整理列表
            }
        }

        document.addEventListener('DOMContentLoaded', loadCosts);
    </script>
</body>
</html>
